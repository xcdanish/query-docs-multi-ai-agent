name: query-docs-multi-ai-agent

services:
  db:
    container_name: query-docs-postgres
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: query_docs_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - query_docs_postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=4MB
      -c checkpoint_completion_target=0.9
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5

  ollama:
    container_name: query-docs-ollama
    image: ollama/ollama:latest
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - query_docs_ollama_data:/root/.ollama

  backend:
    container_name: query-docs-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8005:8005"
    env_file:
      - backend/.env
    environment:
      - DB_HOST=db
      - OLLAMA_HOST=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - QDRANT_HOST=qdrant
      - HOST=0.0.0.0
      - PORT=8005
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      qdrant:
        condition: service_started

  frontend:
    container_name: query-docs-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8005
    restart: always
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - INTERNAL_BACKEND_URL=http://backend:8005
    depends_on:
      - backend

  langgraph-dev:
    container_name: query-docs-langgraph-dev
    build:
      context: .
      dockerfile: Dockerfile
    command: langgraph dev --host 0.0.0.0 --port 2024 --config /app/langgraph.json
    ports:
      - "2024:2024"
    volumes:
      - ./backend:/app
    env_file:
      - backend/.env
    environment:
      - DB_HOST=db
      - OLLAMA_HOST=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - QDRANT_HOST=qdrant
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      qdrant:
        condition: service_started

  qdrant:
    container_name: query-docs-qdrant
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - query_docs_qdrant_data:/qdrant/storage

volumes:
  query_docs_postgres_data:
  query_docs_ollama_data:
  query_docs_qdrant_data:

