name: query-docs-multi-ai-agent

services:
  db:
    container_name: query-docs-postgres
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: query_docs_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Mapping to 5432 on host as per backend/.env
      - "5432:5432"
    volumes:
      # This named volume ensures data persists even if the container stops/restarts
      - query_docs_postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=4MB
      -c checkpoint_completion_target=0.9
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5

volumes:
  # Define the named volume for persistence
  query_docs_postgres_data:
